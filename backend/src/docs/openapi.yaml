      tags:
        - Me
      summary: Xem lịch sử check-in của tôi
      operationId: getMyCheckins
      description: "Quyền truy cập: Authenticated."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Xem lịch sử check-in của tôi thành công
          content:
            application/json:
              schema:
                type: object
