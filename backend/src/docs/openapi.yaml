                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCheckin"
                  error:
                    nullable: true
                    example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/store/categories:
    get:
      tags:
        - Categories
      summary: Xem danh mục
      operationId: listCategories
      description: "Quyền truy cập: Public."
      security: []
      responses:
        "200":
          description: Xem danh mục thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                  error:
                    nullable: true
                    example: null
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Categories
      summary: Tạo danh mục
      operationId: createCategory
      description: "Quyền truy cập: Admin."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Tạo danh mục thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Category"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/store/categories/{id}:
    put:
      tags:
        - Categories
      summary: Đổi tên danh mục
      operationId: updateCategory
      description: "Quyền truy cập: Admin."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Đổi tên danh mục thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Category"
                  error:
                    nullable: true
                    example: null
