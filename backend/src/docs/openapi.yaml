# Tài liệu API đang hoạt động; đối chiếu backend/src/routes khi thêm hoặc sửa endpoint.
# Mật khẩu và token thật chỉ nhập trong Swagger, không lưu trong file.
openapi: 3.0.3
info:
  title: Gym and Supplement Store API
  version: 0.3.0
  description: "Tài liệu cho các endpoint đang được mount trong backend. Nhấn Try it out để gửi request. Đăng nhập để lấy data.access_token rồi dán token vào Authorize, không thêm chữ Bearer. Đơn vị tiền: VND. Token và mật khẩu thật không được lưu trong tài liệu."
servers:
  - url: /
    description: Cùng máy chủ đang phục vụ Swagger UI
tags:
  - name: Health
    description: Kiểm tra ứng dụng và database.
  - name: Auth
    description: Đăng ký và đăng nhập; đăng ký luôn tạo role member.
  - name: Plans
    description: Xem gói tập công khai; quản lý gói tập dành cho Admin.
  - name: Members
    description: Quản lý hội viên dành cho Admin và Staff.
  - name: Checkins
    description: Check-in và danh sách hôm nay dành cho Admin và Staff.
  - name: Me
    description: Dữ liệu của chính tài khoản đăng nhập.
  - name: Categories
    description: Danh mục sản phẩm; thao tác ghi dành cho Admin.
  - name: Products
    description: Sản phẩm, variant, upload ảnh; thao tác ghi dành cho Admin.
  - name: Cart
    description: Giỏ hàng của chính tài khoản đăng nhập.
  - name: Orders
    description: Checkout COD từ giỏ hàng hiện tại.
  - name: Dashboard
    description: Thống kê Gym và Store cho Admin và Staff.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness without a database connection
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Health
      description: "Quyền truy cập: Public."
      security: []
  /api/health:
    get:
      operationId: getApiHealth
      summary: API-prefixed alias of the liveness endpoint
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Health
      description: "Quyền truy cập: Public."
      security: []
  /health/db:
    get:
      operationId: getDatabaseHealth
      summary: Check the configured PostgreSQL database with a read-only query
      responses:
        "200":
          $ref: "#/components/responses/DatabaseHealthy"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
      tags:
        - Health
      description: "Quyền truy cập: Public."
      security: []
  /api/health/db:
    get:
      operationId: getApiDatabaseHealth
      summary: API-prefixed alias of the database health endpoint
      responses:
        "200":
          $ref: "#/components/responses/DatabaseHealthy"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
      tags:
        - Health
      description: "Quyền truy cập: Public."
      security: []
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản hội viên
      operationId: register
      description: |-
        Quyền truy cập: Public.

        Server luôn tạo member và bỏ qua role được gửi từ client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Đăng ký tài khoản hội viên thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthData"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập
      operationId: login
      description: "Quyền truy cập: Public."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthData"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/google:
    post:
      tags:
        - Auth
      summary: Sign in with Google
      operationId: googleLogin
      description: |-
        Public member sign-in. Send the Google Identity Services ID token in `credential`.
        The backend verifies its signature, audience and verified email before issuing the app JWT.
        Staff and admin accounts continue to use password sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginInput"
      responses:
        "200":
          description: Google sign-in succeeded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthData"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Google sign-in is not configured

  /api/plans:
    get:
      tags:
        - Plans
      summary: Xem các gói tập active
      operationId: getActivePlans
      description: "Quyền truy cập: Public."
      security: []
      responses:
        "200":
          description: Xem các gói tập active thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  error:
                    nullable: true
                    example: null
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Plans
      summary: Tạo gói tập
      operationId: createPlan
      description: "Quyền truy cập: Admin."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Tạo gói tập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Plan"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/plans/{id}:
    get:
      tags:
        - Plans
      summary: Xem chi tiết gói tập
      operationId: getPlanById
      description: "Quyền truy cập: Public."
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Xem chi tiết gói tập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Plan"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Plans
      summary: Cập nhật gói tập
      operationId: updatePlan
      description: |-
        Quyền truy cập: Admin.

        Chỉ gửi các trường cần đổi. Body không có trường cập nhật cũng trả 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateInput"
      responses:
        "200":
          description: Cập nhật gói tập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Plan"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Plans
      summary: Ẩn gói tập
      operationId: hidePlan
      description: |-
        Quyền truy cập: Admin.

        Xóa mềm: đổi status sang hidden, không xóa bản ghi.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Ẩn gói tập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PlanHidden"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/members:
    get:
      tags:
        - Members
      summary: Xem danh sách hội viên
      operationId: getMembers
      description: "Quyền truy cập: Admin / Staff."
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Tìm theo tên hoặc email.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Số trang.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Số kết quả mỗi trang, tối đa 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Xem danh sách hội viên thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/MemberList"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/members/{id}:
    get:
      tags:
        - Members
      summary: Xem chi tiết hội viên
      operationId: getMemberById
      description: "Quyền truy cập: Admin / Staff."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Xem chi tiết hội viên thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/MemberDetail"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/members/{id}/memberships:
    post:
      tags:
        - Members
      summary: Đăng ký gói tập cho hội viên
      operationId: createMembership
      description: |-
        Quyền truy cập: Admin / Staff.

        id trên URL là ID tài khoản hội viên. Server tự tính end_date từ start_date và duration_days của gói.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID số nguyên dương; lấy từ API danh sách tương ứng.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "201":
          description: Đăng ký gói tập cho hội viên thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/MembershipCreated"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/checkins:
    post:
      tags:
        - Checkins
      summary: Tạo check-in
      operationId: createCheckin
      description: |-
        Quyền truy cập: Admin / Staff.

        Trả 400 MEMBERSHIP_EXPIRED nếu không có gói active còn hạn theo kiểm tra hiện tại của backend.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "201":
          description: Tạo check-in thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/Checkin"
                  error:
                    nullable: true
                    example: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/checkins/today:
    get:
      tags:
        - Checkins
      summary: Xem check-in hôm nay
      operationId: getTodayCheckins
      description: "Quyền truy cập: Admin / Staff."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Xem check-in hôm nay thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TodayCheckin"
                  error:
                    nullable: true
                    example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/me/profile:
    get:
      tags:
        - Me
      summary: Xem hồ sơ của tôi
      operationId: getMyProfile
      description: "Quyền truy cập: Authenticated."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Xem hồ sơ của tôi thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/User"
                  error:
                    nullable: true
                    example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/me/memberships:
    get:
      tags:
        - Me
      summary: Xem các gói tập của tôi
      operationId: getMyMemberships
      description: "Quyền truy cập: Authenticated."
      security:
        - bearerAuth: []
      responses:
