          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/store/orders/{orderId}:
    get:
      tags: [Orders]
      summary: View my order
      operationId: getOwnOrder
      description: Returns delivery details, checkout item snapshots and payment status. A missing order and an order owned by someone else both return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Order details belonging to the authenticated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/OwnOrderDetail" }
                  error: { nullable: true, example: null }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/stats:
    get:
      tags:
        - Dashboard
      summary: Xem thống kê dashboard
      operationId: getAdminStats
      description: "Quyền truy cập: Admin / Staff. Doanh thu hôm nay và trong tháng tính theo múi giờ phiên database. Store tính đơn delivered theo updated_at; Gym tính payment membership completed theo updated_at. Active members đếm user duy nhất có gói active trong thời hạn. Gói sắp hết hạn: từ hôm nay đến 7 ngày tới. Top 5 sản phẩm theo tổng số lượng trong đơn không bị cancelled. Tồn kho thấp: stock <= 5, gồm hết hàng."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thống kê dashboard
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AdminStats"
                  error:
                    nullable: true
                    example: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
