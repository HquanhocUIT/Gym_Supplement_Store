  responses:
    DatabaseHealthy:
      description: PostgreSQL returned a result from the read-only health query
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
              - error
            properties:
              success:
                type: boolean
                enum:
                  - true
              data:
                type: object
                required:
                  - status
                  - database
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  database:
                    type: string
                    enum:
                      - connected
                  timestamp:
                    type: string
                    format: date-time
              error:
                type: object
                nullable: true
                example: null
    DatabaseUnavailable:
      description: Connection or query failed; connection details are not exposed
      content:
        application/json:
          example:
            success: false
            data: null
            error:
              code: DATABASE_UNAVAILABLE
              message: Không thể kết nối database. Kiểm tra cấu hình và thử lại.
    Healthy:
      description: API is running; database readiness is not checked
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
              - error
            properties:
              success:
                type: boolean
                enum:
                  - true
              data:
                type: object
                required:
                  - status
                  - timestamp
                  - uptime
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    minimum: 0
              error:
                type: object
                nullable: true
                example: null
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          example:
            success: false
            data: null
            error:
              code: INTERNAL_ERROR
              message: Internal Server Error
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Thiếu token, token không hợp lệ hoặc đã hết hạn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tài khoản không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Dữ liệu bị trùng, đang được sử dụng, giỏ trống hoặc không đủ tồn kho
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Ảnh vượt quá giới hạn 5 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Lỗi máy chủ hoặc cấu hình
